[project]
name = "hyperate-overlay"
version = "1.2.2"
description = "Hyperate 三值置顶悬浮窗 - 实时显示当前/最高/最低心率的透明悬浮窗应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
    "websockets>=15.0.1",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[dependency-groups]
plots = [
    "matplotlib>=3.6.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hyperate_overlay"]

[project.scripts]
hyperate-overlay = "hyperate_overlay.main:main"
hyperate-analyzer = "hyperate_overlay.heart_rate_analyzer:main"
